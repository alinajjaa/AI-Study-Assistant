# Sert le frontend Angular et redirige /api vers le backend (même origine : pas de CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Import des PDF de cours
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un examen complet peut prendre plusieurs minutes (limites de débit de l'offre gratuite de Groq)
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Routes Angular (/companion, /flashcards…) : index.html, jamais mis en cache
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
