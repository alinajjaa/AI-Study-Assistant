<section class="card" aria-labelledby="courses-title">
  <div class="header">
    <h2 id="courses-title" class="card__title">Mes cours</h2>
    @if (loading() || deleting()) {
      <app-loader size="sm" />
    } @else {
      <span class="count">{{ courses().length }}</span>
    }
  </div>

  <ul class="list">
    <li class="row">
      <button
        type="button"
        class="item"
        [class.item--active]="selected() === null"
        [attr.aria-current]="selected() === null ? 'true' : null"
        (click)="select(null)"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m12 3 9 5-9 5-9-5z" /><path d="m3 13 9 5 9-5" />
        </svg>
        <span class="name">Tous les cours</span>
      </button>
    </li>

    @for (course of courses(); track course) {
      <li class="row">
        <button
          type="button"
          class="item"
          [class.item--active]="course === selected()"
          [attr.aria-current]="course === selected() ? 'true' : null"
          [title]="course"
          (click)="select(course)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" />
          </svg>
          <span class="name">{{ course }}</span>
        </button>
        <button
          type="button"
          class="icon-btn icon-btn--danger"
          [attr.aria-label]="'Supprimer le cours ' + course"
          [title]="'Supprimer « ' + course + ' »'"
          [disabled]="deleting()"
          (click)="onDelete(course)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M4 7h16" /><path d="M10 11v6M14 11v6" /><path d="m6 7 1 13h10l1-13" /><path d="M9 7V4h6v3" />
          </svg>
        </button>
      </li>
    }
  </ul>

  @if (courses().length === 0 && !loading()) {
    <p class="hint empty">Aucun cours indexé pour l'instant : ajoute un PDF pour commencer.</p>
  }
</section>
