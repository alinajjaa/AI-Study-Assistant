<article class="answer" [class.answer--off]="offCourse()">
  <header class="head">
    @if (offCourse()) {
      <span class="tag tag--off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 7.5h.01" />
        </svg>
        Hors du cours
      </span>
    } @else {
      <span class="tag">Tuteur</span>
    }

    <button type="button" class="btn btn--ghost btn--sm copy" (click)="copy()">
      @if (copyState() === 'copied') {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m5 12 5 5 9-10" />
        </svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h9" />
        </svg>
      }
      <span aria-live="polite">{{ copyLabel() }}</span>
    </button>
  </header>

  @if (offCourse()) {
    <p class="off-note">Cette information ne figure pas dans le cours interrogé.</p>
  }

  <!-- HTML issu de marked, nettoyé par la sanitization d'Angular -->
  <div class="markdown" [innerHTML]="html()" (click)="onContentClick($event)"></div>

  @if (!offCourse()) {
    <app-sources-list class="sources" [sources]="response().sources" [(activePage)]="activePage" />
  }
</article>
