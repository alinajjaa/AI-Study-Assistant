<form class="composer" (submit)="$event.preventDefault(); send()">
  <label class="sr-only" for="question">{{ label() }}</label>
  <textarea
    #textarea
    id="question"
    class="input"
    rows="1"
    [placeholder]="placeholder()"
    aria-describedby="question-hint"
    [value]="text()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  ></textarea>

  <div class="footer">
    <p id="question-hint" class="hint">
      <span class="target">Cours : <strong>{{ course() ?? noCourseLabel() }}</strong></span>
      <span class="shortcut"><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">Entrée</kbd> pour envoyer</span>
    </p>
    @if (length() > 0) {
      <span class="hint counter" aria-hidden="true">{{ length() }} car.</span>
    }
    <button type="submit" class="btn send" [disabled]="!canSend()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M21 3 10 14" /><path d="m21 3-7 18-4-7-7-4z" />
      </svg>
      {{ loading() ? 'En attente…' : 'Envoyer' }}
    </button>
  </div>
</form>
