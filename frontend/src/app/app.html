<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/">
      <span class="brand__logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H20" />
          <path d="M8 7h8M8 11h5" />
        </svg>
      </span>
      <span class="brand__name">AI Study Assistant</span>
    </a>
    @if (auth.isAuthenticated()) {
      <!-- Sous 1280 px : menu compact, ouvert par ce bouton -->
      <button
        type="button"
        class="btn btn--ghost btn--sm menu-toggle"
        aria-controls="main-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
        Menu
      </button>
      <div id="main-menu" class="menu" [class.menu--open]="menuOpen()">
        <nav aria-label="Navigation principale">
          @for (link of links; track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="nav-link--active"
              ariaCurrentWhenActive="page"
              class="nav-link"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          }
        </nav>
        <div class="account">
          @if (auth.user(); as user) {
            <span class="account__email" [title]="user.email">{{ user.email }}</span>
          }
          <button type="button" class="btn btn--ghost btn--sm" (click)="logout()">Déconnexion</button>
        </div>
      </div>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<app-toasts />
