<a class="skip-link" href="#main-content">Aller au contenu</a>

<!--
  Connecté, à partir de 1024 px : barre latérale (nouvelle conversation, recherche, récents, compte), repliable
  en rail d'icônes par le bouton en haut ou Ctrl+B. Moins de 1024 px : barre du haut et barre en tiroir.
-->
<header
  #header
  class="app-header"
  (mouseover)="showTip($event)"
  (mouseout)="hideTip()"
  (focusin)="showTip($event)"
  (focusout)="hideTip()"
  (keydown)="onRailKeydown($event)"
>
  <div class="app-header__inner">
    <div class="brand-row">
      @if (auth.isAuthenticated()) {
        <button
          #sidebarToggle
          type="button"
          class="icon-btn sidebar-toggle"
          aria-controls="main-menu"
          aria-keyshortcuts="Control+B Meta+B"
          [attr.aria-expanded]="!collapsed()"
          [attr.aria-label]="collapsed() ? 'Déplier la barre latérale' : 'Replier la barre latérale'"
          [attr.data-tip]="(collapsed() ? 'Déplier' : 'Replier') + ' la barre (' + shortcut + ')'"
          data-tip-always
          (click)="toggleCollapsed()"
        >
          <app-icon name="sidebar" [size]="18" />
        </button>
      }
      <a class="brand" routerLink="/">
        <span class="brand__logo" aria-hidden="true">
          <app-icon name="book" [size]="19" />
        </span>
        <span class="brand__name">AI Study Assistant</span>
      </a>
    </div>

    @if (auth.isAuthenticated()) {
      <!-- Moins de 1024 px : la barre latérale s'ouvre en tiroir avec ce bouton -->
      <button
        type="button"
        class="btn btn--ghost btn--sm menu-toggle"
        aria-controls="main-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
        Menu
      </button>
      @if (menuOpen()) {
        <div class="menu-backdrop" aria-hidden="true" (click)="closeMenu()"></div>
      }
      <div id="main-menu" class="menu menu--drawer" [class.menu--open]="menuOpen()">
        <app-shell-sidebar [collapsed]="collapsed()" />
      </div>
    } @else {
      <button type="button" class="icon-btn theme-toggle--icon" [attr.aria-label]="themeLabel()" [title]="themeLabel()" (click)="theme.toggle()">
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
    }
  </div>
</header>

@if (tip(); as current) {
  <div class="shell-tip" aria-hidden="true" [style.top.px]="current.top" [style.left.px]="current.left">{{ current.text }}</div>
}

<main id="main-content" class="app-main" tabindex="-1">
  @if (auth.isAuthenticated()) {
    <app-nav-tabs class="app-tabs" />
  }
  <router-outlet />
</main>

<app-toasts />
<app-confirm-dialog />
