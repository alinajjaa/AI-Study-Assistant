<!-- Région toujours présente dans le DOM pour que les lecteurs d'écran annoncent les ajouts -->
<ol class="stack" aria-live="polite" aria-label="Notifications">
  @for (toast of service.toasts(); track toast.id) {
    <li class="toast" [class]="'toast--' + toast.kind">
      <span class="icon" aria-hidden="true">
        @switch (toast.kind) {
          @case ('success') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="12" cy="12" r="9" /><path d="m8 12.5 2.7 2.7L16 9.5" />
            </svg>
          }
          @case ('warning') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M12 3 2 20h20z" /><path d="M12 10v4" /><path d="M12 17h.01" />
            </svg>
          }
          @case ('error') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="12" cy="12" r="9" /><path d="M12 7v6" /><path d="M12 16.5h.01" />
            </svg>
          }
          @default {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 7.5h.01" />
            </svg>
          }
        }
      </span>
      <div class="body">
        <p class="title">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="message">{{ toast.message }}</p>
        }
      </div>
      <button type="button" class="icon-btn close" aria-label="Fermer la notification" (click)="service.dismiss(toast.id)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </li>
  }
</ol>
